<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Super Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-gray-100">


    <header
        class="bg-[#00323F] text-white px-6 py-5"
    >

        <h1 class="text-2xl font-bold">
            Super Admin Dashboard
        </h1>

    </header>


    <main class="p-6">


        <div
            class="bg-white rounded-2xl p-8 shadow"
        >

            <h2
                class="text-xl font-semibold text-[#00323F]"
            >
                Welcome, Super Admin
            </h2>


            <p class="mt-2 text-gray-500">

                You have successfully logged in.

            </p>


            <div class="mt-8 grid gap-5 md:grid-cols-2">


                <button
                    class="rounded-xl bg-[#FECA42] p-6 text-left"
                >

                    <h3 class="font-bold text-[#00323F]">
                        Create Institution
                    </h3>

                    <p class="mt-1 text-sm text-[#00323F]/70">
                        Create a new institution.
                    </p>

                </button>


                <button
                    class="rounded-xl bg-[#00323F] p-6 text-left text-white"
                >

                    <h3 class="font-bold">
                        Create Institution Admin
                    </h3>

                    <p class="mt-1 text-sm text-white/70">
                        Create an admin for an institution.
                    </p>

                </button>


            </div>


        </div>


    </main>


</body>

</html>
