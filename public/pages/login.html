<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="min-h-screen bg-[#00323F] flex items-center justify-center p-5"
>


    <!-- ================================================= -->
    <!-- MAIN CONTAINER -->
    <!-- ================================================= -->

    <div
        class="w-full max-w-5xl min-h-[650px] bg-white rounded-3xl
        overflow-hidden shadow-2xl grid grid-cols-1 md:grid-cols-2"
    >


        <!-- ================================================= -->
        <!-- LEFT SIDE -->
        <!-- ================================================= -->

        <div
            class="relative bg-[#FECA42] flex flex-col items-center
            justify-center text-center p-10 overflow-hidden"
        >


            <!-- LOGO -->

            <div
                class="relative z-10
                flex
                items-center
                justify-center"
            >

                <img
                    src="../assets/images/svr-logo.png"
                    alt="SVR EDTECH Logo"
                    class="w-80 max-w-full h-auto object-contain"
                >

            </div>


            <!-- ADMIN PORTAL -->

            <h2
                class="relative z-10 mt-7 text-3xl font-bold text-[#00323F]"
            >
                Admin Portal
            </h2>


            <!-- DESCRIPTION -->

            <p
                class="relative z-10 mt-3 max-w-sm text-sm leading-6 text-[#00323F]/75"
            >
                Securely manage your platform,
                users and administration.
            </p>


        </div>



        <!-- ================================================= -->
        <!-- RIGHT SIDE -->
        <!-- ================================================= -->

        <div
            class="flex items-center justify-center bg-white p-7 sm:p-10 md:p-12"
        >

            <div
                class="w-full max-w-md"
            >


                <!-- ================================================= -->
                <!-- LOGIN HEADING -->
                <!-- ================================================= -->

                <div
                    id="loginHeading"
                    class="mb-8"
                >

                    <h1
                        class="text-3xl sm:text-4xl font-bold text-[#00323F]"
                    >
                        Welcome Back
                    </h1>

                    <p
                        class="mt-2 text-sm text-gray-500"
                    >
                        Sign in to your admin account
                    </p>

                </div>



                <!-- ================================================= -->
                <!-- LOGIN FORM -->
                <!-- ================================================= -->

                <form
                    id="adminLoginForm"
                    class="space-y-5"
                >


                    <!-- EMAIL -->

                    <div>

                        <label
                            for="email"
                            class="mb-2 block text-sm font-semibold text-gray-700"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                            class="w-full rounded-xl border border-gray-300
                            px-4 py-3 text-sm text-gray-800
                            outline-none transition
                            placeholder:text-gray-400
                            focus:border-[#00323F]
                            focus:ring-2 focus:ring-[#00323F]/10"
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div>

                        <div
                            class="mb-2 flex items-center justify-between"
                        >

                            <label
                                for="password"
                                class="text-sm font-semibold text-gray-700"
                            >
                                Password
                            </label>


                            <a
                                href="forgot-password.html"
                                id="forgotPassword"
                                class="text-sm font-medium text-[#00323F]
                                transition hover:underline"
                            >
                                Forgot Password?
                            </a>

                        </div>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="w-full rounded-xl border border-gray-300
                            px-4 py-3 text-sm text-gray-800
                            outline-none transition
                            placeholder:text-gray-400
                            focus:border-[#00323F]
                            focus:ring-2 focus:ring-[#00323F]/10"
                        >

                    </div>



                    <!-- ================================================= -->
                    <!-- LOGIN MESSAGE -->
                    <!-- ================================================= -->

                    <p
                        id="loginMessage"
                        class="hidden text-center text-sm font-medium"
                    ></p>



                    <!-- ================================================= -->
                    <!-- LOGIN BUTTON -->
                    <!-- ================================================= -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="w-full rounded-xl bg-[#00323F]
                        py-3.5 text-sm font-semibold text-white
                        shadow-lg transition
                        hover:bg-[#024957]
                        active:scale-[0.98]
                        disabled:cursor-not-allowed
                        disabled:opacity-60"
                    >
                        Login
                    </button>

                </form>



                <!-- ================================================= -->
                <!-- OTP SECTION -->
                <!-- ================================================= -->

                <form
                    id="otpForm"
                    class="hidden space-y-5"
                >


                    <!-- OTP HEADING -->

                    <div>

                        <h2
                            class="text-2xl font-bold text-[#00323F]"
                        >
                            Verify Your Email
                        </h2>

                        <p
                            class="mt-2 text-sm leading-6 text-gray-500"
                        >
                            We have sent a 6-digit OTP to your email address.
                        </p>

                        <p
                            id="otpEmail"
                            class="mt-1 text-sm font-semibold text-[#00323F]"
                        ></p>

                    </div>



                    <!-- ================================================= -->
                    <!-- OTP INPUT -->
                    <!-- ================================================= -->

                    <div>

                        <label
                            for="otp"
                            class="mb-2 block text-sm font-semibold text-gray-700"
                        >
                            Enter OTP
                        </label>

                        <input
                            type="password"
                            id="otp"
                            name="otp"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            placeholder="Enter 6-digit OTP"
                            required
                            class="w-full rounded-xl border border-gray-300
                            px-4 py-3 text-center text-lg
                            font-semibold tracking-[0.5em]
                            text-gray-800 outline-none transition
                            placeholder:text-gray-400
                            placeholder:tracking-normal
                            focus:border-[#00323F]
                            focus:ring-2 focus:ring-[#00323F]/10"
                        >

                    </div>



                    <!-- ================================================= -->
                    <!-- OTP MESSAGE -->
                    <!-- ================================================= -->

                    <p
                        id="otpMessage"
                        class="hidden text-center text-sm font-medium"
                    ></p>



                    <!-- ================================================= -->
                    <!-- VERIFY BUTTON -->
                    <!-- ================================================= -->

                    <button
                        type="submit"
                        id="verifyOtpButton"
                        class="w-full rounded-xl bg-[#00323F]
                        py-3.5 text-sm font-semibold text-white
                        shadow-lg transition
                        hover:bg-[#024957]
                        active:scale-[0.98]
                        disabled:cursor-not-allowed
                        disabled:opacity-60"
                    >
                        Verify OTP
                    </button>



                    <!-- ================================================= -->
                    <!-- RESEND OTP -->
                    <!-- ================================================= -->

                    <div class="text-center">

                        <p
                            class="text-sm text-gray-500"
                        >
                            Didn't receive the OTP?
                        </p>

                        <button
                            type="button"
                            id="resendOtpButton"
                            class="mt-1 text-sm font-semibold
                            text-[#00323F]
                            hover:underline
                            disabled:cursor-not-allowed
                            disabled:no-underline
                            disabled:opacity-50"
                        >
                            Resend OTP
                        </button>

                        <p
                            id="resendCountdown"
                            class="mt-1 text-xs text-gray-400 hidden"
                        ></p>

                    </div>



                    <!-- ================================================= -->
                    <!-- BACK TO LOGIN -->
                    <!-- ================================================= -->

                    <button
                        type="button"
                        id="backToLogin"
                        class="w-full text-sm font-medium
                        text-[#00323F] hover:underline"
                    >
                        Back to Login
                    </button>


                </form>



                <!-- ================================================= -->
                <!-- SOCIAL LOGIN -->
                <!-- ================================================= -->

                <div
                    id="socialSection"
                >

                    <div
                        class="my-7 flex items-center gap-3"
                    >

                        <div
                            class="h-px flex-1 bg-gray-200"
                        ></div>

                        <span
                            class="whitespace-nowrap text-xs
                            font-medium text-gray-400"
                        >
                            OR CONTINUE WITH
                        </span>

                        <div
                            class="h-px flex-1 bg-gray-200"
                        ></div>

                    </div>



                    <!-- SOCIAL BUTTONS -->

                    <div
                        class="grid grid-cols-2 gap-3"
                    >


                        <!-- GOOGLE -->

                        <button
                            type="button"
                            id="googleLogin"
                            class="flex h-12 items-center
                            justify-center gap-2 rounded-xl
                            border border-gray-300 bg-white px-3
                            text-sm font-semibold text-gray-700
                            transition hover:border-gray-400
                            hover:bg-gray-50
                            active:scale-[0.98]"
                        >

                            <svg
                                class="h-5 w-5"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.54 13.83a5.86 5.86 0 0 1 0-3.66V7.64H3.3a9.75 9.75 0 0 0 0 8.72l3.24 2.53z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.14c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 7.86 9.46 6.14 12 6.14z"
                                />

                            </svg>

                            <span>Google</span>

                        </button>



                        <!-- MICROSOFT -->

                        <button
                            type="button"
                            id="microsoftLogin"
                            class="flex h-12 items-center
                            justify-center gap-2 rounded-xl
                            border border-gray-300 bg-white px-3
                            text-sm font-semibold text-gray-700
                            transition hover:border-gray-400
                            hover:bg-gray-50
                            active:scale-[0.98]"
                        >

                            <svg
                                class="h-5 w-5"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <rect
                                    x="2"
                                    y="2"
                                    width="9"
                                    height="9"
                                    fill="#F25022"
                                />

                                <rect
                                    x="13"
                                    y="2"
                                    width="9"
                                    height="9"
                                    fill="#7FBA00"
                                />

                                <rect
                                    x="2"
                                    y="13"
                                    width="9"
                                    height="9"
                                    fill="#00A4EF"
                                />

                                <rect
                                    x="13"
                                    y="13"
                                    width="9"
                                    height="9"
                                    fill="#FFB900"
                                />

                            </svg>

                            <span>Microsoft</span>

                        </button>

                    </div>

                </div>



                <!-- ================================================= -->
                <!-- FOOTER -->
                <!-- ================================================= -->

                <p
                    class="mt-8 text-center text-xs text-gray-400"
                >
                    © 2026 SVR EDTECH.
                    All rights reserved.
                </p>


            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script
        src="https://accounts.google.com/gsi/client"
        defer
    ></script>

    <script
        src="../js/login.js"
        defer
    ></script>


</body>

</html>
